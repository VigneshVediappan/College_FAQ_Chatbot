<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College AI FAQ Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #0b1120;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            display: flex;
            background: #111827;
            border-radius: 20px;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: #0f172a;
            padding: 25px 20px;
            border-right: 1px solid #263244;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #3b82f6;
        }

        .status {
            background: #172033;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .status-title {
            font-size: 13px;
            color: #94a3b8;
        }

        .online {
            margin-top: 8px;
            font-size: 14px;
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 25px;
            border-bottom: 1px solid #263244;
        }

        .header h1 {
            font-size: 21px;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 5px;
        }

        #chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .bubble {
            background: #2563eb;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: #1e293b;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        .typing {
            color: #94a3b8;
            font-size: 13px;
            margin: 10px 0;
        }

        .input-area {
            padding: 18px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #263244;
            background: #0f172a;
        }

        #question {
            flex: 1;
            padding: 14px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .send-btn {
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                display: none;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            🎓 College<span>AI</span>
        </div>

        <div class="status">

            <div class="status-title">
                SYSTEM STATUS
            </div>

            <div class="online">
                <span class="dot"></span>
                AI Assistant Online
            </div>

        </div>

        <button class="clear-btn" onclick="clearChat()">
            🗑 Clear Chat
        </button>

    </aside>


    <main class="main">

        <header class="header">

            <h1>College AI FAQ Assistant</h1>

            <p>
                Ask questions about college facilities, exams, fees and more.
            </p>

        </header>


        <div id="chat-box"></div>


        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask your question..."
            >

            <button
                class="send-btn"
                onclick="askQuestion()"
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>


/* Add message to screen */

function addMessage(role, message) {

    const chatBox =
        document.getElementById("chat-box");

    const messageDiv =
        document.createElement("div");

    messageDiv.className =
        role === "user"
        ? "message user"
        : "message bot";

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.innerText = message;

    messageDiv.appendChild(bubble);

    chatBox.appendChild(messageDiv);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* Load previous chats from SQLite */

async function loadChatHistory() {

    try {

        const response =
            await fetch("/history");

        const history =
            await response.json();

        const chatBox =
            document.getElementById("chat-box");

        chatBox.innerHTML = "";


        if (history.length === 0) {

            addMessage(
                "bot",
                "👋 Hello! I'm your College AI Assistant.\n\nAsk me about college timings, library, fees, hostel, exams, attendance or placements."
            );

            return;
        }


        history.forEach(function(chat) {

            addMessage(
                "user",
                chat.user
            );

            addMessage(
                "bot",
                chat.bot
            );

        });


        chatBox.scrollTop =
            chatBox.scrollHeight;


    } catch (error) {

        console.error(
            "History loading error:",
            error
        );

        addMessage(
            "bot",
            "❌ Unable to load chat history."
        );
    }
}


/* Ask question */

async function askQuestion() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();


    if (question === "") {
        return;
    }


    addMessage(
        "user",
        question
    );


    input.value = "";


    const chatBox =
        document.getElementById("chat-box");


    const typing =
        document.createElement("div");

    typing.className = "typing";

    typing.innerText =
        "🤖 AI Assistant is typing...";

    chatBox.appendChild(typing);

    chatBox.scrollTop =
        chatBox.scrollHeight;


    try {

        const response =
            await fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


        const data =
            await response.json();


        typing.remove();

let answer = data.answer;

if (data.source) {
    answer += "\n\n📄 Source: " + data.source;
}

addMessage(
    "bot",
    answer
);


    } catch (error) {

        typing.remove();

        addMessage(
            "bot",
            "❌ Unable to connect to the chatbot server."
        );

    }

}


/* Clear screen */

function clearChat() {

    const chatBox =
        document.getElementById("chat-box");

    chatBox.innerHTML = "";

    addMessage(
        "bot",
        "👋 Chat cleared! Previous conversations are still stored in the database."
    );
}


/* Enter key */

document
    .getElementById("question")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                askQuestion();

            }

        }
    );


/* Load history when page opens */

window.addEventListener(
    "load",
    function() {

        loadChatHistory();

    }
);


</script>

</body>

</html>
